[package]
name = "linux-chess"
version = "0.1.21"
edition = "2021"
description = "Play chess against a bot locally on your Linux machine, with performance in mind"
authors = ["CatPrinceHQ"]
license = "GPL-3.0-or-later"
rust-version = "1.85"

[lib]
name = "cea"
path = "src/lib.rs"

[[bin]]
name = "linux-chess"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "mock-uci-engine"
path = "src/bin/mock_uci_engine.rs"

[features]
default = ["gui"]
gui = ["dep:gtk4", "dep:libadwaita", "dep:pangocairo"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk4 = { version = "0.8", optional = true, features = ["v4_10"] }
libadwaita = { version = "0.6", optional = true, features = ["v1_4"] }
pangocairo = { version = "0.19", optional = true }

[profile.release]
lto = "thin"
strip = true
